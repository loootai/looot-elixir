name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15.8"
            otp: "26"
          - elixir: "1.18.4"
            otp: "27"
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: erlef/setup-beam@v1.18.2
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: bash scripts/leak-scan.sh .
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - name: Build the docs
        if: matrix.elixir == '1.18.4'
        run: MIX_ENV=dev mix docs --warnings-as-errors
      - name: Build the Hex package
        if: matrix.elixir == '1.18.4'
        run: mix hex.build
